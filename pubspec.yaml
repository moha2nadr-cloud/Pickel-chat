name: pickle_chat
description: PickleChat - AI chat client for Big Pickle model
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.0
  flutter_markdown: ^0.7.0
  shared_preferences: ^2.2.0
  uuid: ^4.3.0
  intl: ^0.19.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/pickle.svg
